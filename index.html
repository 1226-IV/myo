<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Myo: Training, Ernährung und Fortschritt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0}img{max-width:100%}</style>
<title>Myo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: ein Logbuch in einer Spalte (max. 780px). Abschnitte werden durch Haarlinien getrennt, nur das laufende Training liegt als Fläche darüber. Tabs unten am Handy, oben am Desktop. */
/* Myo Crimson: ein dunkles Schema aus acht Farbwerten. Rot steht für Aktionen, Gold für Labels und Erfolge. Alle Komponenten greifen nur auf diese Variablen zu. */
:root{
  --bg:#121212;          /* Hintergrund */
  --surface:#1E1E1E;     /* Karten und Container */
  --surface-hi:#2A2A2A;  /* Hover-Zustände */
  --accent:#E63946;      /* Buttons, aktive Icons, Highlights */
  --text:#F5F5F5;        /* Haupttext */
  --text-2:#A0A0A0;      /* Nebentext */
  --border:#333333;      /* Linien und Rahmen */
  --gold:#C9A45C;        /* Goldakzent: Labels, Bestwerte, Auszeichnungen */
  /* 16 Farben für Trainingspläne in der Jahresübersicht, über das Spektrum verteilt */
  --plan-crimson:var(--accent); --plan-coral:#FF7F6B; --plan-orange:#F4A03A; --plan-gold:var(--gold);
  --plan-yellow:#F2D45C; --plan-lime:#A7D44A; --plan-green:#4CC38A; --plan-teal:#2BB3A3;
  --plan-cyan:#3FC1E0; --plan-sky:#5B9BF2; --plan-indigo:#7B7FF2; --plan-violet:#A77BF2;
  --plan-magenta:#D96AD9; --plan-pink:#F27BAA; --plan-white:var(--text); --plan-copper:#A0703F;
  /* Restday und freies Training */
  --cat-rest:#5C5C5C; --cat-free:#8D99AE;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --navh:58px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(var(--navh) + 28px)}
.app{max-width:780px;margin-inline:auto}
h1,h2,h3{margin:0;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;line-height:1.02;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:28px;font-weight:800}
h3{font-size:20px;font-weight:700;letter-spacing:.02em}
p{margin:0}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.gold{color:var(--gold)}
.muted{color:var(--text-2)}
.tn{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--gold)}
.wm{display:flex;align-items:center;gap:12px}
.wm svg{width:30px;height:30px;flex:none;fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round}
.wm h1{font-size:42px;font-weight:800;letter-spacing:.08em;line-height:1;color:var(--gold)}
.top .date{font-size:14px;color:var(--text-2);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
.sync{font:inherit;font-size:12px;font-weight:600;color:var(--text-2);background:none;border:0;padding:6px 0;min-height:32px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.top .date #today{white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--text-2);flex:none}
.sync[data-s="ok"]::before{background:var(--gold)}
.sync[data-s="saving"]::before,.sync[data-s="connecting"]::before{background:var(--text-2)}
.sync[data-s="err"]::before,.sync[data-s="slow"]::before{background:var(--accent)}
.sync:hover{color:var(--text)}
main{display:flex;flex-direction:column;gap:32px;margin-top:22px}
.block{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--border);padding-top:18px;min-width:0}
.block>.note:first-child{margin-top:0}
.row{display:flex;gap:12px;align-items:center}
.row.between{justify-content:space-between;align-items:flex-start}
.row.wrap{flex-wrap:wrap}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;
  background:var(--surface);border-top:1px solid var(--border);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;border-radius:6px;
  color:var(--text-2);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.02em}
.tabs a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a:hover{background:var(--surface-hi)}
.tabs a[aria-current="page"]{color:var(--text)}
.tabs a[aria-current="page"] svg{stroke:var(--accent)}

/* Controls */
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .2s}
.btn:hover{background:var(--surface-hi);border-color:var(--text-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--text);font-weight:700;font-size:16px;
  box-shadow:0 0 12px -1px var(--accent),0 6px 22px -10px var(--accent)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);box-shadow:0 0 16px 0 var(--accent),0 8px 26px -8px var(--accent)}
.btn.primary[disabled]{box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-hi);color:var(--text);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.icon-btn{font:inherit;font-size:22px;line-height:1;width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text-2);cursor:pointer}
.icon-btn:hover{background:var(--surface-hi);color:var(--text)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
input,select,textarea{font:inherit;font-size:17px;color:var(--text);background:var(--surface);border:1.5px solid var(--text-2);
  border-radius:6px;min-height:48px;padding:0 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
::placeholder{color:var(--text-2);opacity:1}
textarea{padding:10px 12px;min-height:84px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px}
.block.panel{border-color:var(--gold)}
.panel input,.panel select{background:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.inl{font-size:13px;font-weight:600;color:var(--text-2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.err{color:var(--text);font-weight:600;font-size:14px;border-left:3px solid var(--accent);padding-left:10px}
.cap{font-size:13px;color:var(--text-2)}
.note{border:1px dashed var(--text-2);border-radius:6px;padding:10px 12px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:2px 6px;border-radius:3px;margin-left:8px;vertical-align:2px}
details>summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}

/* Training */
.list{display:flex;flex-direction:column;gap:10px}
.planbtn{font:inherit;color:var(--text);text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;width:100%}
.planbtn:hover{background:var(--surface-hi)}
.planbtn b{font-size:17px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px;align-items:center}
.planbtn .pmain{min-width:0}
.planbtn .exn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planbtn small{display:block;color:var(--text-2);font-size:13px;margin-top:2px}
.planbtn .go{color:var(--text);font-weight:700;font-size:14px;border-bottom:2px solid var(--accent)}
.stat1{text-align:right}
.stat1 b{display:block;font:800 28px/1 var(--font-display);letter-spacing:.02em;color:var(--gold)}
.ex{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--border)}
.ex:first-of-type{border-top:0}
.hint{font-size:13px;color:var(--text-2);margin-top:2px}
.sets{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.srow.head{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);text-align:center}
.srow .sn{text-align:center;font-weight:700;color:var(--text-2)}
.srow input{text-align:center;font-weight:700;font-size:22px;min-height:54px;background:var(--bg);color:var(--text)}
.srow.done input{border-color:var(--accent)}
.chk{width:52px;height:54px;border-radius:6px;border:1.5px solid var(--text-2);background:var(--bg);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.chk svg{width:22px;height:22px;opacity:.5}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--text)}
.chk[aria-pressed="true"] svg{opacity:1}
.addex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.hist{border-top:1px solid var(--border)}
.hist summary{display:grid;grid-template-columns:64px minmax(0,1fr) 18px;gap:12px;align-items:center;list-style:none;min-height:56px;padding-block:8px}
.hist summary::-webkit-details-marker{display:none}
.hist summary::after{content:"+";color:var(--text-2);font-size:20px;text-align:center}
.hist[open] summary::after{content:"\2212"}
.dcell{display:flex;flex-direction:column;font-size:13px;color:var(--text-2);line-height:1.15}
.dcell b{font:800 22px/1 var(--font-display);text-transform:uppercase;color:var(--gold);letter-spacing:.03em}
.hist .meta{display:block;font-weight:400;font-size:13px;color:var(--text-2)}
.hist ul{list-style:none;margin:0;padding:0 0 12px;display:flex;flex-direction:column;gap:10px}
.hist li{display:flex;flex-direction:column}
.hist li span{font-size:13px;color:var(--text-2)}

/* Pläne */
.plan{border-top:1px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.exl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exl li{display:flex;justify-content:space-between;gap:12px;padding-block:6px;border-top:1px solid var(--border);font-size:15px}
.exl li:first-child{border-top:0}
.exl li span:last-child{color:var(--text-2);text-align:right}
.pex{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--border)}
.pex-top{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
.pex-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pex-nums label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--text-2)}

/* Fortschritt */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{padding:2px 12px;border-left:1px solid var(--border);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:800 clamp(30px,9vw,44px)/1 var(--font-display);letter-spacing:.02em;color:var(--gold)}
.stat b small{font-size:.5em;margin-left:3px;color:var(--text-2)}
.stat span{font-size:13px;color:var(--text-2);display:block;margin-top:4px}
.chart{width:100%;min-height:150px}
.chart svg{display:block;max-width:100%}
.empty{padding-block:18px}
.gl{stroke:var(--border);stroke-width:1}
.ax{fill:var(--text-2);font:11px var(--font-body);font-variant-numeric:tabular-nums}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.area{fill:var(--accent);fill-opacity:.12;stroke:none}
.dot{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.dot.last{fill:var(--accent)}
.val{fill:var(--text);font:700 12px var(--font-body);font-variant-numeric:tabular-nums}
.bar{fill:var(--text-2)}
.bar.cur{fill:var(--accent)}
.goal{stroke:var(--text);stroke-width:1.5;stroke-dasharray:5 4}
.inline-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end}
.sel{min-width:0;max-width:240px}

/* Ernährung */
.daynav{display:flex;align-items:center;gap:2px}
.dlabel{min-width:72px;text-align:center;font-weight:600}
.kcal b.big{font:800 clamp(44px,13vw,64px)/1 var(--font-display);letter-spacing:.02em;color:var(--gold)}
.track{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.track.lg{height:12px;border-radius:6px}
.fillb{height:100%;border-radius:inherit}
.mrow{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.mlabel{display:flex;align-items:center;gap:8px;white-space:nowrap}
.dotc{width:10px;height:10px;border-radius:50%;flex:none}
.mval{color:var(--text-2);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.chip:hover{background:var(--surface-hi)}
.meal{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--border)}
.meal small{display:block;color:var(--text-2);font-size:13px}
.meal .k{font-weight:700;text-align:right}
.split{display:flex;gap:2px}
.split .seg{height:100%}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.macro{display:flex;flex-direction:column;gap:4px;min-width:0}
.macro .mlabel{white-space:normal;font-size:13px;color:var(--text-2)}
.macro b{font-size:20px}
.preset{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 8px 8px 14px}
.pinfo{min-width:0}
.pinfo b{display:block;font-size:16px}
.pinfo small{display:block;color:var(--text-2);font-size:13px;margin-top:2px}
.btn.primary.sm{box-shadow:0 0 8px -2px var(--accent)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer;min-height:44px}
.check input{width:22px;height:22px;min-height:22px;padding:0;flex:none;accent-color:var(--accent);cursor:pointer}
.yt{display:grid;grid-template-columns:30px repeat(31,minmax(0,1fr));gap:2px;max-width:620px}
.yt .dh{font-size:9px;color:var(--text-2);text-align:center;font-variant-numeric:tabular-nums;line-height:1.5;overflow:visible;white-space:nowrap}
.yt .mn{font-size:10px;font-weight:600;color:var(--text-2);align-self:center;text-transform:uppercase;letter-spacing:.03em}
.yt .mh{font-size:11px;font-weight:700;color:var(--text-2);text-align:center;padding-bottom:2px}
.yt .dn{font-size:10px;color:var(--text-2);text-align:right;padding-right:3px;align-self:center;font-variant-numeric:tabular-nums}
.yc{display:block;aspect-ratio:1;max-width:100%;min-width:0;border:0;padding:0;border-radius:2px;background:var(--surface-hi);cursor:pointer}
.yc:hover{outline:1px solid var(--text-2)}
.yc.today{outline:1.5px solid var(--gold);outline-offset:0}
.yc.sel{outline:1.5px solid var(--text);outline-offset:0}
.yc.fut{background:var(--surface);cursor:default}
.yc.na{visibility:hidden}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 18px;font-size:14px}
.leg .li{display:flex;align-items:center;gap:8px;min-width:0}
.leg i,.chip.cat i{width:12px;height:12px;border-radius:3px;flex:none}
.leg b{margin-left:auto;color:var(--text-2);font-weight:600}
.chip.cat{display:inline-flex;align-items:center;gap:8px}
.legs{display:grid;gap:14px}
.legs .leg{margin-top:8px}
.leg .ln2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;max-width:340px}
.sw{width:100%;max-width:36px;aspect-ratio:1;height:auto;border-radius:50%;border:2px solid var(--bg);padding:0;cursor:pointer}
.sw.on{outline:2px solid var(--gold);outline-offset:2px}
.chip.cat.on{border-color:var(--gold)}
.planbtn .dotc{display:inline-block;margin-right:8px;vertical-align:2px}
.sheet{position:fixed;z-index:28;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:780px;margin-inline:auto;
  bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 10px);background:var(--surface-hi);color:var(--text);border:1px solid var(--gold);border-radius:10px;
  padding:12px 12px 14px 16px;display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto}
.sheet .chip{background:var(--surface)}
.locrow{gap:12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;background:var(--surface)}
.seg button{font:inherit;font-size:15px;font-weight:600;min-height:40px;padding:0 16px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text-2);cursor:pointer}
.seg button:hover{background:var(--surface-hi);color:var(--text)}
.seg button.on{background:var(--surface-hi);color:var(--gold);border-color:var(--gold)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;font-weight:600;color:var(--text-2);border:1px solid var(--border);border-radius:10px;padding:1px 8px}
.hint.up{font-weight:600}
.srow.uni{grid-template-columns:30px repeat(3,minmax(0,1fr)) 52px}
.pex-nums4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pex-nums4 label,.pex-notes label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--text-2);min-width:0}
.pex-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check.sm{font-size:14px;min-height:36px}
.ln.l2{stroke:var(--gold)}
.dot.l2{stroke:var(--gold)}
.dot.last.l2{fill:var(--gold)}
.clegend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-2)}
.clegend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.fx{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 100px) max(16px,env(safe-area-inset-left,0px))}
body.fx-open{overflow:hidden}
.fx-in{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.fx-top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--gold);padding-bottom:8px}
.fx-count{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.fx-name{font-size:clamp(28px,8.5vw,44px);line-height:1.05;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;min-width:0}
.fx-sets{display:flex;align-items:center;gap:8px}
.fxd{width:28px;height:6px;border-radius:3px;background:var(--surface-hi)}
.fxd.done{background:var(--accent)}
.fxd.cur{outline:1.5px solid var(--gold);outline-offset:3px}
.fx-sn{margin-left:auto;font-weight:700}
.fx-fields{display:grid;gap:14px}
.fx-fields.uni{grid-template-columns:repeat(2,minmax(0,1fr))}
.fx-fields.uni .fx-wide{grid-column:1/-1}
.fx-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fx-l{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.08em}
.stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px}
.fx-fields.uni .fx-field:not(.fx-wide .fx-field) .stepper{grid-template-columns:40px minmax(0,1fr) 40px;gap:6px}
.stepper input{min-height:72px;font-size:34px;font-weight:800;text-align:center;background:var(--surface);padding:0 4px}
.stp{font:inherit;font-size:28px;font-weight:600;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;padding:0}
.stp:hover{background:var(--surface-hi)}
.fx-go{min-height:64px;font-size:20px;width:100%}
.fx-nav{display:flex;justify-content:space-between}
.rest{z-index:40}
.toast{z-index:41}
.restmark{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--gold);border-radius:8px;padding:6px 6px 6px 14px;font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.supp{font:inherit;color:var(--text);text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-height:92px;position:relative;min-width:0}
.supp:hover{background:var(--surface-hi)}
.supp b{font-size:16px;padding-right:32px}
.supp small{font-size:13px;color:var(--text-2)}
.supp .sc{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--text-2);display:grid;place-items:center;color:var(--text-2)}
.supp .sc svg{width:16px;height:16px;opacity:.35}
.supp.on{border-color:var(--gold)}
.supp.on .sc{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.supp.on .sc svg{opacity:1}
.supp.on .st{color:var(--gold)}
.supp small.gold{color:var(--gold)}
.gfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-block:8px}

/* Schwebende Leisten */
.rest,.toast{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  max-width:780px;margin-inline:auto;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 10px);
  background:var(--surface-hi);color:var(--text);border:1px solid var(--text-2);border-radius:8px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;overflow:hidden}
.toast{z-index:41}
.rest>:not(.rest-fill){position:relative}
.rest-fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.35;pointer-events:none;width:100%}
.rest b{font:800 30px/1 var(--font-display);letter-spacing:.03em;font-variant-numeric:tabular-nums;margin-right:auto}
.rest .btn,.toast .btn{background:transparent;color:var(--text);border-color:var(--text-2)}
.toast span{margin-right:auto;font-size:14px}
.rest .btn{white-space:nowrap}

@media (max-width:420px){
  .inline-form{grid-template-columns:1fr 1fr}
  .inline-form .btn{grid-column:1/-1}
  .rest .btn{padding:0 8px}
  .rest>span{display:none}
}
@media (min-width:720px){
  :root{--navh:0px}
  body{padding-block:28px 64px}
  .tabs{position:static;display:flex;gap:4px;padding:0;margin-top:22px;border:0;border-bottom:1px solid var(--border);background:none}
  .tabs a{flex-direction:row;gap:8px;font-size:15px;padding:0 14px;min-height:48px;border-radius:0;border-bottom:3px solid transparent;margin-bottom:-1px}
  .tabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--accent)}
  .rest,.toast,.sheet{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.upd{position:fixed;z-index:42;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:780px;margin-inline:auto;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 10px);background:var(--surface-hi);color:var(--text);border:1px solid var(--gold);border-radius:8px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px}
.upd span{margin-right:auto;font-weight:600}
@media (min-width:720px){.upd{bottom:calc(16px + env(safe-area-inset-bottom,0px))}}

<script>
(function(){
'use strict';
var KEY='kraftbuch.v1',storageOk=true;
var TABS=['training','ernaehrung','fortschritt'];
var BASE=['Bankdrücken','Kniebeuge','Kreuzheben','Schulterdrücken','Klimmzüge','Langhantelrudern','Latziehen','Bizepscurls','Trizepsdrücken','Beinpresse','Rumänisches Kreuzheben','Seitheben','Face Pulls','Wadenheben','Dips'];
var CATS=[['rest','Restday']];
var LOCS=['Dresden','Radebeul'];
var SUPPS=[['omega3','Omega-3'],['d3k2','Vitamin D3/K2'],['mg','Magnesium'],['creatin','Creatin']];
function E(n,s,a,b,o){o=o||{};return{n:n,s:s,rmin:a,rmax:b,w:0,same:!o.diff,uni:!!o.uni,note:o.note||{}}}
var USER_PLANS=[
  {id:'tA',name:'Training A · Chest/Back',color:'crimson',ex:[E('T Row breit',3,6,8),E('Schrägbank Brustpresse',2,6,8),E('Latpulldown',2,6,8,{diff:1,note:{Dresden:'Maschine, Gewicht je Seite',Radebeul:'Kabelturm'}}),E('Butterfly',2,6,8,{diff:1}),E('T Row eng',2,6,8),E('Bauchmaschine',2,10,12,{diff:1})]},
  {id:'tB',name:'Training B · Shoulder/Arms',color:'sky',ex:[E('Schulterdrücken',2,6,8,{diff:1}),E('Seitheben',2,6,8,{uni:1}),E('Reverse Butterfly',2,6,8,{uni:1}),E('Preacher Curls',2,6,8,{uni:1}),E('Skullcrusher',2,6,8),E('Hammer Curls',2,6,8,{uni:1,diff:1}),E('Trizeps Pushdown',2,6,8,{uni:1})]},
  {id:'tC',name:'Training C · Legs',color:'gold',ex:[E('Beinbeuger sitzend',2,6,8),E('Stiff-Legged Deadlift',1,6,8),E('Beinpresse',1,6,8,{diff:1}),E('Beinstrecker',2,6,8),E('Adduktoren',2,6,8,{diff:1}),E('Wadenheben',2,10,15),E('Back Wrist',2,8,10,{diff:1}),E('Grip Curl',2,8,10,{diff:1})]}
];
var USER_PRESETS=[
  {id:'pr-fruehstueck',n:'Frühstück',kcal:930,c:113,p:74,f:21},
  {id:'pr-mittag',n:'Mittag',kcal:777,c:100,p:58,f:12},
  {id:'pr-mittag2',n:'Mittag 2',kcal:896,c:91,p:51,f:33},
  {id:'pr-snack',n:'Snack: Proteinriegel',kcal:165,c:9,p:22,f:6},
  {id:'pr-pre',n:'Pre-Workout',kcal:338,c:77,p:6,f:0},
  {id:'pr-post',n:'Post-Workout',kcal:567,c:79,p:16,f:20},
  {id:'pr-rest',n:'Rest-Day-Snack',kcal:840,c:119,p:23,f:28}
];
function copy(o){return JSON.parse(JSON.stringify(o))}
var PCOL=['crimson','coral','orange','gold','yellow','lime','green','teal','cyan','sky','indigo','violet','magenta','pink','white','copper'];
var PCOLN={crimson:'Karmin',coral:'Koralle',orange:'Orange',gold:'Gold',yellow:'Gelb',lime:'Limette',green:'Grün',teal:'Petrol',cyan:'Cyan',sky:'Himmelblau',indigo:'Indigo',violet:'Violett',magenta:'Magenta',pink:'Pink',white:'Weiß',copper:'Kupfer'};
var PCOL_OLD={p1:'crimson',p2:'gold',p3:'white',p4:'orange',p5:'pink',p6:'copper'};
var PCOL_NEXT=['crimson','sky','gold','green','violet','orange','cyan','pink','lime','indigo','coral','teal','magenta','yellow','white','copper'];
var CATN={};CATS.forEach(function(c){CATN[c[0]]=c[1]});
function planById(id){var p=null;S.plans.forEach(function(x){if(x.id===id)p=x});return p}
function planColor(p){var c=PCOL_OLD[p.color]||p.color;if(c&&PCOLN[c])return c;var i=S.plans.indexOf(p);return PCOL_NEXT[(i<0?0:i)%PCOL_NEXT.length]}
function nextColor(){var used={};S.plans.forEach(function(p){used[planColor(p)]=1});for(var i=0;i<PCOL_NEXT.length;i++)if(!used[PCOL_NEXT[i]])return PCOL_NEXT[i];return PCOL_NEXT[S.plans.length%PCOL_NEXT.length]}
function isPlanKey(k){return typeof k==='string'&&k.indexOf('plan:')===0}
function catVar(k){
  if(isPlanKey(k)){var p=planById(k.slice(5));return p?'var(--plan-'+planColor(p)+')':'var(--cat-free)'}
  if(k==='free')return'var(--cat-free)';
  return'var(--cat-'+(CATN[k]?k:'free')+')';
}
function catName(k){if(isPlanKey(k)){var p=planById(k.slice(5));return p?p.name:'Freies Training'}if(k==='free')return'Freies Training';return CATN[k]||'Freies Training'}
function validCat(k){return!!(CATN[k]||k==='free'||(isPlanKey(k)&&planById(k.slice(5))))}
function guessCat(n){n=(n||'').toLowerCase();if(/bein|leg|unter|squat|kniebeuge/.test(n))return'lower';if(/push|pull|ober|brust|rücken|arm|schulter|upper/.test(n))return'upper';return'full'}
function $(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,9)}
function pad(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pdate(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function today(){var d=new Date();d.setHours(12,0,0,0);return d}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0}
function fmt(n,d){return n.toLocaleString('de-DE',{maximumFractionDigits:d==null?1:d})}
function sgn(n,d){return(n>0?'+':n<0?'−':'')+fmt(Math.abs(n),d)}
function mmss(s){s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60)}
function kc(p,c,f){return Math.round(4*p+4*c+9*f)}
var fLong=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'});
var fShort=new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'short'});
var fHead=new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'numeric',month:'short'});
var fWd=new Intl.DateTimeFormat('de-DE',{weekday:'short'});
function wdn(d){return fWd.format(d).replace('.','')}
function byDate(a,b){return a.d<b.d?-1:a.d>b.d?1:0}
function weekStart(d){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}

/* ---------- Zustand ---------- */
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&s.v===1)return s}}catch(e){storageOk=false}
  return null;
}
var BASEKEY='kraftbuch.base';
var sync={status:'connecting',err:null,col:null,live:false,busy:false,again:false,retried:false,timer:null,slowT:null,pendingRender:false,name:'',base:{uid:null,ids:{}}};
function saveLocal(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}
}
function save(){saveLocal();syncTouch()}
function empty(){
  return{v:1,sample:false,goals:{kcal:2500,p:165,c:280,f:80},settings:{rest:180,loc:'Dresden'},plans:[],workouts:[],weights:[],meals:[],presets:[],days:{},supps:{},active:null};
}
function normEx(e){
  var rmin=e.rmin!=null?+e.rmin:(+e.r||8),rmax=e.rmax!=null?+e.rmax:(+e.r||rmin);
  if(rmax<rmin)rmax=rmin;
  var note={};LOCS.forEach(function(l){if(e.note&&e.note[l])note[l]=String(e.note[l])});
  return{n:e.n||'',s:Math.max(1,+e.s||1),rmin:rmin,rmax:rmax,w:+e.w||0,same:e.same!==false,uni:!!e.uni,note:note};
}
function migrate(){
  if(!S.setup3){if(!S.settings.rest||S.settings.rest===90)S.settings.rest=180;S.setup3=true}
  if(S.setup2)return;
  if(S.sample){
    S.plans=S.plans.filter(function(p){return['p1','p2','p3'].indexOf(p.id)<0});
    var old=['Haferflocken mit Skyr','Proteinshake','Hähnchen, Reis, Brokkoli','Lachs mit Kartoffeln'];
    S.presets=S.presets.filter(function(p){return old.indexOf(p.n)<0});
  }
  var names={};S.plans.forEach(function(p){names[p.name]=1});
  copy(USER_PLANS).forEach(function(p){if(!planById(p.id)&&!names[p.name])S.plans.push(p)});
  var pn={},pid={};S.presets.forEach(function(p){pn[p.n]=1;pid[p.id]=1});
  copy(USER_PRESETS).forEach(function(p){if(!pn[p.n]&&!pid[p.id])S.presets.push(p)});
  S.setup2=true;
}
function normalize(){
  var d=empty();
  S.goals=S.goals||d.goals;S.settings=S.settings||d.settings;
  ['plans','workouts','weights','meals','presets'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});
  if(!S.active)S.active=null;
  if(!S.days||typeof S.days!=='object'||Array.isArray(S.days))S.days={};
  if(!S.supps||typeof S.supps!=='object'||Array.isArray(S.supps))S.supps={};
  if(LOCS.indexOf(S.settings.loc)<0)S.settings.loc=LOCS[0];
  S.plans.forEach(function(p){p.ex=(p.ex||[]).map(normEx)});
  S.workouts.sort(byDate);S.weights.sort(byDate);
}
function seed(){
  var td=today(),plans=copy(USER_PLANS).map(function(p){p.ex=p.ex.map(normEx);return p});
  var BW={'T Row breit':45,'Schrägbank Brustpresse':45,'Latpulldown':60,'Butterfly':70,'T Row eng':40,'Bauchmaschine':50,'Schulterdrücken':35,'Seitheben':35,'Reverse Butterfly':40,'Preacher Curls':18,'Skullcrusher':30,'Hammer Curls':14,'Trizeps Pushdown':50,'Beinbeuger sitzend':75,'Stiff-Legged Deadlift':70,'Beinpresse':120,'Beinstrecker':70,'Adduktoren':50,'Wadenheben':70,'Back Wrist':40,'Grip Curl':55};
  var dow={1:plans[0],3:plans[1],5:plans[2]},workouts=[],n=0;
  for(var i=56;i>=1;i--){
    var d=addDays(td,-i),p=dow[d.getDay()];
    if(!p||(i*7+d.getDay())%11===0)continue;
    var k=Math.floor((56-i)/7),loc=LOCS[(n++)%2];
    workouts.push({id:uid(),d:dkey(d),n:p.name,planId:p.id,loc:loc,dur:48+(i*7)%19,entries:p.ex.map(function(e){
      var w=Math.round((BW[e.n]||30)*(e.same||loc==='Dresden'?1:0.88)*(1+0.012*k)*2)/2,sets=[];
      for(var j=0;j<e.s;j++){
        var r=Math.max(e.rmin,e.rmax-((j+i)%3===0?1:0)-(j>0?1:0));
        sets.push(e.uni?{rl:r,rr:Math.max(e.rmin,r-((i+j)%2)),w:w}:{r:r,w:w});
      }
      return{ex:e.n,sets:sets};
    })});
  }
  var weights=[];
  for(var q=0;q<=18;q++)weights.push({d:dkey(addDays(td,-(56-q*3))),kg:Math.round((83.4-0.1*q+Math.sin(q*1.9)*0.35)*10)/10});
  var M=[['Haferflocken mit Skyr',38,62,11],['Rührei auf Vollkornbrot',34,40,24],['Quark mit Beeren',30,22,2],['Hähnchen, Reis, Brokkoli',48,70,9],['Linsen-Eintopf',32,64,10],['Lachs mit Kartoffeln',40,48,26],['Nudeln mit Hackfleischsoße',44,92,22],['Proteinshake',30,6,2],['Banane und Nüsse',8,30,16]];
  var meals=[];
  function pm(dk,m){meals.push({id:uid(),d:dk,n:m[0],p:m[1],c:m[2],f:m[3],kcal:kc(m[1],m[2],m[3])})}
  for(var r=6;r>=1;r--){var k2=dkey(addDays(td,-r));pm(k2,M[r%3]);pm(k2,M[3+r%4]);pm(k2,M[3+(r+2)%4]);pm(k2,M[7]);pm(k2,M[8])}
  var tk=dkey(td);pm(tk,M[0]);pm(tk,M[3]);
  var days={},wd={};workouts.forEach(function(w){wd[w.d]=1});
  for(var j=56;j>=1;j--){var dd=addDays(td,-j),kk=dkey(dd),g=dd.getDay();if(wd[kk])continue;
    days[kk]='rest'}
  var s=empty();s.setup2=true;s.days=days;s.sample=true;s.plans=plans;s.workouts=workouts;s.weights=weights;s.meals=meals;
  s.presets=copy(USER_PRESETS);
  return s;
}
var S=load();
if(!S){S=seed();save()}
normalize();
migrate();
normalize();
saveLocal();

var ui={tab:'training',plan:null,exSel:null,day:dkey(new Date()),histN:8,goalsOpen:false,dataOpen:false};
function currentTab(){var h='';try{h=location.hash.replace('#','')}catch(e){}return TABS.indexOf(h)>=0?h:'training'}
ui.tab=currentTab();

/* ---------- Auswertungen ---------- */
function isUniSet(s){return s.rl!=null||s.rr!=null}
function setReps(s){return isUniSet(s)?(+s.rl||0)+(+s.rr||0):(+s.r||0)}
function minReps(s){return isUniSet(s)?Math.min(+s.rl||0,+s.rr||0):(+s.r||0)}
function vol(entries,onlyDone){var t=0;entries.forEach(function(e){e.sets.forEach(function(s){if(!onlyDone||s.done)t+=setReps(s)*s.w})});return t}
function nSets(w){return w.entries.reduce(function(a,e){return a+e.sets.length},0)}
function curLoc(){return LOCS.indexOf(S.settings.loc)>=0?S.settings.loc:LOCS[0]}
function exDef(name){var d=null;S.plans.forEach(function(p){p.ex.forEach(function(e){if(!d&&e.n===name)d=e})});return d}
function isSplit(name){var d=exDef(name);return!!(d&&d.same===false)}
function lastPerf(ex,loc){
  for(var i=S.workouts.length-1;i>=0;i--){
    var w=S.workouts[i];if(loc&&w.loc!==loc)continue;
    for(var j=0;j<w.entries.length;j++)if(w.entries[j].ex===ex)return{d:w.d,loc:w.loc,sets:w.entries[j].sets};
  }
  return null;
}
function lastFor(ex,loc){return lastPerf(ex,isSplit(ex)?loc:null)}
function hitTop(sets,rmax){return!!(sets&&sets.length&&rmax&&sets.every(function(s){return minReps(s)>=rmax}))}
function topSet(sets){return sets.reduce(function(a,s){return(s.w>a.w||(s.w===a.w&&minReps(s)>minReps(a)))?s:a},sets[0])}
function setTxt(s){
  var r=isUniSet(s)?'L '+(+s.rl||0)+' / R '+(+s.rr||0):String(+s.r||0);
  return s.w>0?r+' \u00d7 '+fmt(s.w,2)+' kg':r+' Wdh';
}
function loadTxt(w){return w>0?fmt(w,2)+' kg':'Körpergewicht'}
function e1(s){var r=minReps(s);return r<=1?s.w:s.w*(1+r/30)}
function exNames(){

function nextPlanId(){
  if(!S.plans.length)return null;

    var pid=S.workouts[i].planId;
    if(pid){var k=-1;S.plans.forEach(function(p,x){if(p.id===pid)k=x});if(k>=0)return S.plans[(k+1)%S.plans.length].id}
  }
  return S.plans[0].id;
}

function suppStreak(k,dk){

  return n;
}

/* ---------- Diagramme ---------- */
function niceTicks(min,max,n){
  if(min===max){min-=1;max+=1}
  var raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mag,step=(r<1.5?1:r<3?2:r<7?5:10)*mag;
  var lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step,t=[];

function cw(el){return Math.max(280,Math.round(el.clientWidth)||320)}

function lineMulti(el,series,o){
  series=series.filter(function(s){return s.pts.length});
  if(!series.length){el.innerHTML='<p class="muted empty">'+esc(o.empty)+'</p>';return}
  var all=[].concat.apply([],series.map(function(s){return s.pts}));
  var w=cw(el),h=220,m={l:46,r:18,t:28,b:30},iw=w-m.l-m.r,ih=h-m.t-m.b;
  var xs=all.map(function(p){return p.x}),ys=all.map(function(p){return p.y});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys);
  var pad=(ymax-ymin)*.12||1,t=niceTicks(ymin-pad,ymax+pad,4),lo=t[0],hi=t[t.length-1],step=t.length>1?t[1]-t[0]:1,dec=step<1?1:0;
  function X(v){return x0===x1?m.l+iw/2:m.l+(v-x0)/(x1-x0)*iw}
  function Y(v){return m.t+ih-(v-lo)/(hi-lo)*ih}
  var s='<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="'+esc(o.aria)+'">';
  t.forEach(function(v){var y=Y(v);s+='<line class="gl" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="ax" x="'+(m.l-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmt(v,dec)+'</text>'});
  var lasts=series.map(function(se){return Y(se.pts[se.pts.length-1].y)});
  series.forEach(function(se,k){
    var pts=se.pts,d=pts.map(function(p,i){return(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)}).join(' ');
    if(pts.length>1){
      if(series.length===1)s+='<path class="area" d="'+d+' L'+X(pts[pts.length-1].x).toFixed(1)+' '+(m.t+ih)+' L'+X(pts[0].x).toFixed(1)+' '+(m.t+ih)+' Z"/>';
      s+='<path class="ln '+se.cls+'" d="'+d+'"/>';
    }
    if(pts.length<=40)pts.forEach(function(p,i){if(i<pts.length-1)s+='<circle class="dot '+se.cls+'" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5"/>'});
    var lp=pts[pts.length-1],lx=X(lp.x),ly=Y(lp.y),an=lx>w-m.r-34?'end':'middle';
    var below=series.length>1&&lasts.some(function(o2,j){return j!==k&&o2<ly});
    s+='<circle class="dot last '+se.cls+'" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5.5"/><text class="val" x="'+(an==='end'?lx+4:lx).toFixed(1)+'" y="'+(below?ly+22:ly-12).toFixed(1)+'" text-anchor="'+an+'">'+fmt(lp.y,o.dec)+' '+o.unit+'</text>';
  });
  var n=x0===x1?1:Math.max(2,Math.min(5,Math.floor(iw/90)));
  for(var i=0;i<n;i++){
    var f=n===1?.5:i/(n-1),a=n>1?(i===0?'start':i===n-1?'end':'middle'):'middle';
    s+='<text class="ax" x="'+(m.l+f*iw).toFixed(1)+'" y="'+(h-8)+'" text-anchor="'+a+'">'+fShort.format(new Date(x0+f*(x1-x0)))+'</text>';
  }
  el.innerHTML=s+'</svg>';
}
function barChart(el,items,o){
  var w=cw(el),h=210,m={l:46,r:12,t:26,b:30},iw=w-m.l-m.r,ih=h-m.t-m.b;
  var mx=Math.max(o.goal||0,Math.max.apply(null,items.map(function(i){return i.v}))||1);
  var t=niceTicks(0,mx*1.08,4),hi=t[t.length-1],step=t[1]-t[0],dec=step<1?1:0;

  t.forEach(function(v){var y=Y(v);s+='<line class="gl" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="ax" x="'+(m.l-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmt(v,dec)+'</text>'});

  el.innerHTML=s+'</svg>';
}
function e1Series(ex,loc){
  var pts=[];
  S.workouts.forEach(function(w){
    if(loc&&w.loc!==loc)return;
    var best=0;
    w.entries.forEach(function(e){if(e.ex===ex)e.sets.forEach(function(s){if(s.w>0&&minReps(s)>0)best=Math.max(best,e1(s))})});
    if(best>0)pts.push({x:pdate(w.d).getTime(),y:Math.round(best*10)/10});
  });
  return pts;
}
function exCounts(){

}

function canon(v){
  if(Array.isArray(v))return'['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return'{'+Object.keys(v).sort().filter(function(k){return v[k]!==undefined}).map(function(k){return JSON.stringify(k)+':'+canon(v[k])}).join(',')+'}';

  S.workouts.forEach(function(x){var k='w-'+x.d.slice(0,7);(w[k]=w[k]||[]).push(x)});
  S.meals.forEach(function(x){var k='m-'+x.d.slice(0,7);(m[k]=m[k]||[]).push(x)});
